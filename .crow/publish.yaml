when:
  - event: tag

steps:
  publish-release:
    image: "woodpeckerci/plugin-release:0.2"
    settings:
      api-key:
        from_secret: release-token
      draft: true
      title: v${CI_COMMIT_TAG}

  publish-docker:
    image: "codefloe.com/crow-plugins/docker-buildx:2.1"
    settings:
      repo: codefloe.com/buriedincode/weatherdan
      registry: codefloe.com
      platforms: linux/amd64,linux/arm64,linux/arm/v7
      auto_tag: true
      username: BuriedInCode
      password:
        from_secret: docker-token
