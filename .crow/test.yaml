depends_on:
  - lint

when:
  - event: push
    branch: main
  - event: pull_request
    branch: main

steps:
  - name: JUnit
    image: "docker.io/gradle:9.5.0-jdk21"
    environment:
      ECOWITT__APPLICATION_KEY:
        from_secret: application-key
      ECOWITT__API_KEY:
        from_secret: api-key
    commands:
      - gradle test
