depends_on:
  - lint

when:
  - event: push
    branch: main
  - event: pull_request
    branch: main

steps:
  - name: Gradle Junit
    image: "eclipse-temurin:21"
    environment:
      ECOWITT__APPLICATION_KEY:
        from_secret: application-key
      ECOWITT__API_KEY:
        from_secret: api-key
    commands:
      - ./gradlew clean test
